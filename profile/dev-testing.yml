# OpenRemote v3
#
# Profile for doing keycloak custom theme development
#
# Please see profile/deploy.yml for configuration details for each service.
#
services:

  keycloak:
    extends:
      file: deploy.yml
      service: keycloak
    volumes:
      - ../deployment/build/image:/deployment
    ports:
      - "8081:8080"
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    extends:
      file: deploy.yml
      service: postgresql
    volumes:
      - ../tmp:/storage
    # Access directly if needed on localhost
    ports:
      - "5432:5432"
